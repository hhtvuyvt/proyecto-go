<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestión de Catálogo SaaS</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand"> 📦 Gestión de Catálogo SaaS </span>

        <div id="userPanel" class="d-none">
          <span id="usernameLabel" class="text-white me-3"> admin </span>
          <button id="logoutButton" class="btn btn-outline-light btn-sm">
            Cerrar sesión
          </button>
        </div>
      </div>
    </nav>

    <div class="container my-4">
      <!-- ============================= -->
      <!-- LOGIN                         -->
      <!-- ============================= -->
      <div id="loginPanel" class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow">
            <div class="card-body">
              <h3 class="mb-4 text-center">Iniciar sesión</h3>

              <form id="loginForm">
                <div class="mb-3">
                  <label for="loginUsername" class="form-label">Usuario</label>
                  <input
                    id="loginUsername"
                    class="form-control"
                    type="text"
                    autocomplete="username"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="loginPassword" class="form-label"
                    >Contraseña</label
                  >
                  <input
                    id="loginPassword"
                    class="form-control"
                    type="password"
                    autocomplete="current-password"
                    required
                  />
                </div>

                <div id="loginError" class="alert alert-danger d-none"></div>

                <button type="submit" class="btn btn-primary w-100">
                  Entrar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- ============================= -->
      <!-- APLICACIÓN                    -->
      <!-- ============================= -->
      <div id="appPanel" class="d-none">
        <h2 class="mb-3">Agregar / Editar Item</h2>

        <!-- FORMULARIO ACTUALIZADO A SAAS -->
        <form id="item-form" class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label"> Nombre del Item </label>
            <input
              type="text"
              id="name"
              name="name"
              class="form-control"
              placeholder="Ej. Laptop Gamer, Habitación Doble"
              required
            />
          </div>

          <div class="col-md-6">
            <label for="category" class="form-label"> Categoría / Tipo </label>
            <input
              type="text"
              id="category"
              name="category"
              class="form-control"
              placeholder="Ej. Electrónica, Suite"
              required
            />
          </div>

          <div class="col-md-4">
            <label for="code" class="form-label"> Código / SKU </label>
            <input
              type="text"
              id="code"
              name="code"
              class="form-control"
              placeholder="Ej. SKU-123, HAB-101"
            />
          </div>

          <div class="col-md-8">
            <label for="image" class="form-label"> URL de la Imagen </label>
            <input
              type="text"
              id="image"
              name="image"
              class="form-control"
              placeholder="https://ejemplo.com/imagen.jpg"
            />
          </div>

          <!-- Sección opcional para el primer detalle al crear el item -->
          <div class="col-12 mt-4">
            <div class="card bg-light border-0 p-3">
              <h5 class="card-title fs-6 text-primary fw-bold mb-3">
                📝 Detalle Inicial (Opcional al crear)
              </h5>
              <div class="row g-2">
                <div class="col-md-4">
                  <label for="initialDetailName" class="form-label small">
                    Nombre del Detalle / Variante
                  </label>
                  <input
                    type="text"
                    id="initialDetailName"
                    name="initialDetailName"
                    class="form-control form-control-sm"
                    placeholder="Ej. Color Negro, Incluye Desayuno"
                  />
                </div>
                <div class="col-12 mt-2">
                  <label for="initialDetailContent" class="form-label small">
                    Descripción / Contenido
                  </label>
                  <textarea
                    id="initialDetailContent"
                    name="initialDetailContent"
                    class="form-control form-control-sm"
                    rows="3"
                    placeholder="Escribe las especificaciones o detalles..."
                  ></textarea>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12">
            <button id="saveButton" type="submit" class="btn btn-success">
              Agregar
            </button>
          </div>
        </form>

        <hr class="my-4" />

        <h2>Catálogo de Items</h2>
        <div id="item-list" class="row g-4"></div>
      </div>
    </div>

    <!-- SCRIPTS ACTUALIZADOS -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/item.js"></script>
    <!-- Cambiado de book.js a item.js -->
    <script src="/static/js/app.js"></script>
  </body>
</html>
